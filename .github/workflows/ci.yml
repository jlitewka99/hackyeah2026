name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prompt_guard:
        description: Run gated Prompt Guard container acceptance (requires approved HF_TOKEN secret)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  container:
    name: Phoenix, NER, Qwen Guard and DeepSeek tokenizer container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CPU release with pinned offline models
        run: docker build --tag ai-control:step10 .
      - name: Verify production HTTPS configuration despite runtime LOCAL_DOCKER override
        run: bash docker/config-smoke ai-control:step10 0
      - name: Real NER, Qwen Guard and DeepSeek tokenizer, release tasks and process supervision
        run: bash docker/smoke ai-control:step10
      - name: Build and verify local HTTP image
        run: |
          docker build --build-arg LOCAL_DOCKER=1 --tag ai-control:local .
          bash docker/config-smoke ai-control:local 1
      - name: Preserve Linux NER measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: step7-linux-ner-benchmark
          path: /tmp/step7-ner-benchmark.json
          if-no-files-found: warn

      - name: Preserve Linux NER v2 measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step18-linux-ner-benchmark
          path: /tmp/step18-ner-benchmark.json
          if-no-files-found: warn

  prompt-guard:
    name: Gated Prompt Guard container acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.prompt_guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build with approved gated access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: docker build --build-arg WITH_PROMPT_GUARD=1 --secret id=hf_token,env=HF_TOKEN --tag ai-control:step11b .
      - name: Real Prompt Guard and five-process supervision
        run: bash docker/smoke ai-control:step11b --prompt-guard

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-${{ runner.arch }}-mix-test-quality-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-test-quality-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile without warnings
        run: mix compile --warnings-as-errors
      - name: Check lockfile
        run: mix deps.unlock --check-unused
      - name: Run Credo
        run: mix credo --strict
      - name: Verify incremental Stream benchmark contract
        run: python3 -m unittest discover -s tests/semantic_stream -v

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
            _build/esbuild-*
            _build/tailwind-*
          key: ${{ runner.os }}-${{ runner.arch }}-mix-test-tests-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs', 'config/config.exs', '.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-test-tests-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - name: Compile without warnings
        run: mix compile --warnings-as-errors
      - name: Prepare separate runner database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE ai_control_runner_ci'
      - name: Run ExUnit
        env:
          TEST_RUNNER_DATABASE_URL: ecto://postgres:postgres@localhost/ai_control_runner_ci
        run: mix test --warnings-as-errors
      - name: Local Docker launcher regressions
        run: python3 -m unittest discover -s tests/docker -v
      - name: Install asset tools
        run: mix assets.setup
      - name: Build assets
        run: mix assets.build

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-${{ runner.arch }}-mix-test-dialyzer-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-test-dialyzer-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-${{ runner.arch }}-plt-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-plt-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - name: Analyze types
        run: mix dialyzer --format github

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-${{ runner.arch }}-mix-test-security-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-test-security-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - name: Scan Phoenix security
        run: mix sobelow --config
      - name: Audit dependencies
        run: mix deps.audit
